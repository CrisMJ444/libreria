# /etc/nginx/sites-available/api-libros  (Ubuntu + PHP 8.3-FPM)
# Ajusta la versión de php-fpm y la ruta del proyecto si es distinta.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/api-libros/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
